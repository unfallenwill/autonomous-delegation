<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 474" width="100%" preserveAspectRatio="xMidYMin meet" role="img" aria-labelledby="ovTitle ovDesc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="ovTitle">Autonomous Delegation — overview</title>
  <desc id="ovDesc">The user states intent to Main. Main writes the task contract, launches one background Supervisor and sends it its own agent ID, then stays out of the work and asks the user only for decisions it is not allowed to make. The Supervisor sends an execution order to the Executor. The Executor reports progress, decisions and problems to the Supervisor, and returns the result and writes it to the result location. The Supervisor checks each acceptance criterion itself, decides what to do when a check fails, and reports to Main: accepted, progress, decisions and the outcome, passing on its judgment rather than relaying. States: DISPATCHED, then RUNNING, VERIFYING and COMPLETED in order, with WAITING_DECISION, BLOCKED, CANCELLING, FAILED, CANCELLED and UNKNOWN alongside. The Supervisor's final report always travels as its handback; without a live message channel, everything does.</desc>

  <defs>
    <marker id="arrMain" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1,1 L9.4,5 L1,9 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrMainRev" viewBox="0 0 10 10" refX="0.8" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M9,1 L0.6,5 L9,9 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrSup" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1,1 L9.4,5 L1,9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrSupRev" viewBox="0 0 10 10" refX="0.8" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M9,1 L0.6,5 L9,9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrExec" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1,1 L9.4,5 L1,9 z" fill="#047857"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="474" fill="#f5f7fa"/>

  <text x="20" y="32" font-size="16" font-weight="700" fill="#0f172a">Autonomous Delegation — how a task flows</text>

  <!-- ================= YOU ================= -->
  <g id="user">
    <rect x="20" y="50" width="220" height="46" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
    <text x="130" y="69" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">YOU</text>
    <text x="130" y="86" font-size="11.5" fill="#475569" text-anchor="middle">intent · decisions</text>
  </g>

  <!-- you <-> main -->
  <g id="link-user-main">
    <line x1="130" y1="96" x2="130" y2="126" stroke="#1d4ed8" stroke-width="1.8" marker-start="url(#arrMainRev)" marker-end="url(#arrMain)"/>
    <text x="142" y="115" font-size="11" fill="#1d4ed8">ask · answer</text>
  </g>

  <!-- ================= MAIN ================= -->
  <g id="main">
    <rect x="20" y="126" width="220" height="256" rx="12" fill="#eef4ff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="36" y="152" font-size="15" font-weight="700" fill="#1d4ed8">MAIN</text>
    <text x="36" y="170" font-size="11.5" fill="#334155">your conversation</text>
    <line x1="36" y1="180" x2="224" y2="180" stroke="#bfd3fb" stroke-width="1"/>

    <text x="36" y="201" font-size="12" fill="#0f172a">• Writes the task contract</text>
    <text x="36" y="219" font-size="12" fill="#0f172a">• Launches one Supervisor,</text>
    <text x="48" y="237" font-size="12" fill="#0f172a">and sends it its agent ID</text>

    <rect x="32" y="254" width="196" height="52" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
    <text x="42" y="274" font-size="11.5" font-weight="700" fill="#b91c1c">After launch, Main must not</text>
    <text x="42" y="293" font-size="11.5" fill="#7f1d1d">execute, review or supervise</text>

    <text x="36" y="336" font-size="11.5" fill="#475569">Asks you only for decisions</text>
    <text x="36" y="354" font-size="11.5" fill="#475569">it is not allowed to make.</text>
  </g>

  <!-- main -> supervisor -->
  <g id="link-main-sup">
    <line x1="240" y1="200" x2="315" y2="200" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrSup)"/>
    <text x="277" y="190" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">task</text>
    <text x="277" y="216" font-size="10.5" fill="#475569" text-anchor="middle">+ agent ID</text>
  </g>

  <!-- supervisor -> main -->
  <g id="link-sup-main">
    <line x1="315" y1="336" x2="240" y2="336" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrMain)"/>
    <text x="277" y="326" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">reports,</text>
    <text x="277" y="350" font-size="10.5" fill="#475569" text-anchor="middle">not relays</text>
  </g>

  <!-- ================= SUPERVISOR ================= -->
  <g id="supervisor">
    <rect x="315" y="126" width="240" height="256" rx="12" fill="#f5f0ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="331" y="152" font-size="15" font-weight="700" fill="#7c3aed">SUPERVISOR</text>
    <text x="331" y="170" font-size="11.5" fill="#334155">exactly one · owns the outcome</text>
    <line x1="331" y1="180" x2="539" y2="180" stroke="#ddd0fb" stroke-width="1"/>

    <text x="331" y="201" font-size="12" fill="#0f172a">• Checks each acceptance</text>
    <text x="343" y="219" font-size="12" fill="#0f172a">criterion itself;</text>
    <text x="343" y="237" font-size="12" font-weight="700" fill="#0f172a">unknown is not pass</text>

    <text x="331" y="265" font-size="12" fill="#0f172a">• If a check fails, decides:</text>
    <text x="343" y="283" font-size="12" fill="#0f172a">correct, replace or stop</text>

    <text x="331" y="311" font-size="12" fill="#0f172a">• Reports to Main: accepted,</text>
    <text x="343" y="329" font-size="12" fill="#0f172a">progress, decisions, done</text>

    <text x="331" y="352" font-size="11.5" fill="#475569">Passes on its judgment, not</text>
    <text x="331" y="369" font-size="11.5" fill="#475569">the Executor's raw updates.</text>
  </g>

  <!-- supervisor -> executor -->
  <g id="link-sup-exec">
    <line x1="555" y1="200" x2="630" y2="200" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrExec)"/>
    <text x="592" y="190" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle">order</text>
  </g>

  <!-- executor -> supervisor -->
  <g id="link-exec-sup">
    <line x1="630" y1="300" x2="555" y2="300" stroke="#047857" stroke-width="2" marker-end="url(#arrSupRev)"/>
    <text x="592" y="290" font-size="11" font-weight="700" fill="#047857" text-anchor="middle">updates,</text>
    <text x="592" y="314" font-size="10.5" fill="#475569" text-anchor="middle">result</text>
  </g>

  <!-- ================= EXECUTOR ================= -->
  <g id="executor">
    <rect x="630" y="126" width="230" height="256" rx="12" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
    <text x="642" y="152" font-size="15" font-weight="700" fill="#047857">EXECUTOR</text>
    <text x="642" y="170" font-size="11.5" fill="#334155">one active writer</text>
    <line x1="642" y1="180" x2="848" y2="180" stroke="#a7f3d0" stroke-width="1"/>

    <text x="642" y="201" font-size="12" fill="#0f172a">• Works within its order</text>
    <text x="642" y="229" font-size="12" fill="#0f172a">• Reports to the Supervisor:</text>
    <text x="654" y="247" font-size="12" fill="#0f172a">progress, decisions, problems</text>
    <text x="642" y="275" font-size="12" fill="#0f172a">• Returns the result, and writes</text>
    <text x="654" y="293" font-size="12" fill="#0f172a">it to the result location</text>

    <text x="642" y="336" font-size="11.5" fill="#475569">Never changes the contract</text>
    <text x="642" y="354" font-size="11.5" fill="#475569">or claims acceptance.</text>
  </g>

  <text x="20" y="412" font-size="11.5" fill="#475569">States: DISPATCHED → RUNNING → VERIFYING → COMPLETED</text>
  <text x="20" y="432" font-size="11.5" fill="#475569">Also: WAITING_DECISION · BLOCKED · CANCELLING · FAILED · CANCELLED · UNKNOWN</text>
  <text x="20" y="456" font-size="11.5" fill="#475569">The Supervisor's final report always travels as its handback; without a live message channel, everything does.</text>
</svg>
